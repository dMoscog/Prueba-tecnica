<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ action }} Personaje - Rick and Morty</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 500px; margin: 20px; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .btn-submit { background: #28a745; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-submit:hover { background: #218838; }
        .btn-back { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; }
        .btn-back:hover { text-decoration: underline; }
        ul.errorlist { color: #dc3545; padding-left: 15px; font-size: 13px; list-style: none; }
        p { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>{{ action }} Personaje</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            {{ form.as_p }}

            <button type="submit" class="btn-submit">Guardar</button>
        </form>

        <a href="{% url 'character_list' %}" class="btn-back">&larr; Volver al listado</a>
    </div>

</body>
</html>
